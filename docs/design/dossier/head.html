<title>Bisellium Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #F7F9F8;
    --surface: #FFFFFF;
    --surface-2: #EFF4F2;
    --ink: #1A2523;
    --muted: #5A6B67;
    --line: #DCE5E2;
    --accent: #0E7C6B;
    --accent-soft: #E1F0EC;
    --ok: #178A50;
    --ok-soft: #E2F3E9;
    --warn: #B7791F;
    --warn-soft: #F7EDDA;
    --bad: #C0392B;
    --bad-soft: #F9E6E3;
    --pend: #7A8783;
    --pend-soft: #EAEEEC;
    --code-bg: #14201C;
    --code-ink: #D9E7E2;
    --code-accent: #6FD9C2;
    --shadow: 0 1px 2px rgba(20, 35, 30, .06), 0 4px 16px rgba(20, 35, 30, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101614;
      --surface: #18201D;
      --surface-2: #1E2825;
      --ink: #E6EEEB;
      --muted: #93A39E;
      --line: #2A3531;
      --accent: #3ECFB2;
      --accent-soft: #163229;
      --ok: #4CC98A;
      --ok-soft: #14301F;
      --warn: #E0A94E;
      --warn-soft: #34290F;
      --bad: #E5776A;
      --bad-soft: #3A1712;
      --pend: #8B9995;
      --pend-soft: #232D2A;
      --code-bg: #0C1210;
      --code-ink: #CDDCD6;
      --code-accent: #5FD3B8;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101614;
    --surface: #18201D;
    --surface-2: #1E2825;
    --ink: #E6EEEB;
    --muted: #93A39E;
    --line: #2A3531;
    --accent: #3ECFB2;
    --accent-soft: #163229;
    --ok: #4CC98A;
    --ok-soft: #14301F;
    --warn: #E0A94E;
    --warn-soft: #34290F;
    --bad: #E5776A;
    --bad-soft: #3A1712;
    --pend: #8B9995;
    --pend-soft: #232D2A;
    --code-bg: #0C1210;
    --code-ink: #CDDCD6;
    --code-accent: #5FD3B8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    font-size: 16.5px;
    line-height: 1.62;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1020px;
    margin: 0 auto;
    padding: 0 24px 96px;
  }
  .prose { max-width: 72ch; }

  h1, h2, h3 {
    font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif;
    text-wrap: balance;
    line-height: 1.15;
  }
  h1 { font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 700; margin: .2em 0 .25em; letter-spacing: -0.01em; }
  h2 { font-size: 1.7rem; font-weight: 650; margin: 0 0 .5em; }
  h3 { font-size: 1.18rem; font-weight: 600; margin: 2em 0 .5em; }
  p { margin: 0 0 1em; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  strong { font-weight: 600; }
  code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .86em;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .08em .35em;
  }

  .eyebrow {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 .6em;
  }
  header.masthead { padding: 72px 0 40px; border-bottom: 1px solid var(--line); }
  .thesis { font-size: 1.22rem; color: var(--muted); max-width: 60ch; margin: 0; }
  .meta-row {
    display: flex; flex-wrap: wrap; gap: 10px 24px;
    margin-top: 28px;
    font-size: .82rem; color: var(--muted);
    font-family: "IBM Plex Mono", monospace;
  }
  .meta-row span b { color: var(--ink); font-weight: 500; }

  section { padding: 56px 0 8px; }
  .part-rule {
    display: flex; align-items: center; gap: 16px;
    margin: 64px 0 0;
    padding-top: 48px;
    border-top: 1px solid var(--line);
  }
  .part-rule .part-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--bg);
    background: var(--accent);
    padding: 4px 12px; border-radius: 999px;
    white-space: nowrap;
  }
  .part-rule h2 { margin: 0; font-size: 2rem; }

  /* verdict card */
  .verdict {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 26px 30px;
    margin: 36px 0 0;
  }
  .verdict p:last-child { margin-bottom: 0; }

  /* chips */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: .72rem; font-weight: 500;
    padding: 2px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok   { color: var(--ok);   background: var(--ok-soft); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); }
  .chip.bad  { color: var(--bad);  background: var(--bad-soft); }
  .chip.pend { color: var(--pend); background: var(--pend-soft); }

  /* tables */
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); margin: 20px 0 28px; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 640px; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th {
    font-family: "IBM Plex Mono", monospace;
    font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
    background: var(--surface-2);
  }
  tbody tr:last-child td { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }

  /* two-col gap layout */
  .gap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
  @media (max-width: 720px) { .gap-grid { grid-template-columns: 1fr; } }
  .gap-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px 24px; box-shadow: var(--shadow);
  }
  .gap-card h3 { margin-top: 0; }
  .gap-card ul { margin: 0; padding-left: 1.2em; }
  .gap-card li { margin-bottom: .45em; }
  .gap-card.crowded h3 { color: var(--bad); }
  .gap-card.open h3 { color: var(--ok); }

  /* board mock */
  .board-mock {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin: 28px 0;
    overflow-x: auto;
  }
  .board-cols { display: flex; gap: 14px; min-width: 700px; }
  .board-col { flex: 1; }
  .board-col-title {
    font-family: "IBM Plex Mono", monospace;
    font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
    display: flex; justify-content: space-between;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .card .slug { font-family: "IBM Plex Mono", monospace; font-size: .78rem; font-weight: 500; margin-bottom: 2px; }
  .card .who { font-size: .74rem; color: var(--muted); margin-bottom: 8px; }
  .gates { display: flex; gap: 5px; align-items: center; }
  .gate { width: 10px; height: 10px; border-radius: 3px; }
  .gate.passed { background: var(--ok); }
  .gate.failed { background: var(--bad); }
  .gate.pending { background: var(--pend-soft); border: 1px solid var(--pend); }
  .gate-label { font-family: "IBM Plex Mono", monospace; font-size: .64rem; color: var(--muted); margin-left: 4px; }
  .mock-caption { font-size: .8rem; color: var(--muted); margin: 14px 4px 0; }

  /* code blocks */
  pre {
    background: var(--code-bg);
    color: var(--code-ink);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .82rem;
    line-height: 1.55;
    border-radius: 10px;
    padding: 20px 24px;
    overflow-x: auto;
    margin: 20px 0 28px;
  }
  pre .c { color: color-mix(in srgb, var(--code-ink) 55%, transparent); }
  pre .k { color: var(--code-accent); }

  /* build plan */
  ol.plan { counter-reset: step; list-style: none; padding: 0; margin: 24px 0; }
  ol.plan > li {
    counter-increment: step;
    display: grid; grid-template-columns: 44px 1fr; gap: 16px;
    padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  ol.plan > li:last-child { border-bottom: none; }
  ol.plan > li::before {
    content: counter(step, decimal-leading-zero);
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 1.4rem; font-weight: 700; color: var(--accent);
    line-height: 1.2;
  }
  ol.plan b { font-weight: 600; }
  ol.plan p { margin: .25em 0 0; font-size: .92rem; color: var(--muted); }

  ul.reading { list-style: none; padding: 0; margin: 20px 0; }
  ul.reading li { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .94rem; }
  ul.reading li:last-child { border-bottom: none; }
  ul.reading .why { color: var(--muted); font-size: .86rem; }

  .footnote { margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
</style>
