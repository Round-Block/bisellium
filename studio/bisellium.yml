bisellium: 1
studio: Bisellium
patron: patron
timezone: UTC
hooks: { default_sella: guest }
collegia:
  - { id: production, name: Production, magister: producer, lex: leges/production.md }
  - { id: design, name: Design, magister: architect, lex: leges/design.md }
  - { id: engineering, name: Engineering, magister: eng-lead, fallback: producer, lex: leges/engineering.md }
  - { id: qa, name: QA, magister: qa-lead, lex: leges/qa.md }
  - { id: ops, name: Ops, magister: ops-lead, lex: leges/ops.md }
sellae:
  - { id: producer, collegium: production, kind: orchestrator, model: claude-opus-5-5 }
  - { id: architect, collegium: design, kind: agent, model: claude-opus-5-5 }
  - { id: ui-lead, collegium: design, kind: agent, model: gpt-6-astra, harness: codex }
  - { id: eng-lead, collegium: engineering, kind: agent, model: claude-opus-5-5 }
  # W-089: seats are templates, not enumerated builders — one row per build
  # tier, instance identity minted at dispatch as `<seat>.<opus-id>`
  # (resolveSeat/seatInstance, @bisellium/adapter-native). The five lettered
  # rows below are retired tombstones: kept declared so every record that
  # ever named one stays readable and blocking-clean, refused as a live
  # dispatch target.
  - { id: builder, collegium: engineering, kind: agent, model: claude-sonnet-5 }
  - { id: builder-codex, collegium: engineering, kind: agent, model: gpt-5.6-sol, harness: codex }
  - { id: builder-a, collegium: engineering, kind: agent, model: claude-sonnet-5, retired: true }
  - { id: builder-b, collegium: engineering, kind: agent, model: claude-sonnet-5, retired: true }
  - { id: builder-c, collegium: engineering, kind: agent, model: claude-sonnet-5, retired: true }
  - { id: builder-d, collegium: engineering, kind: agent, model: claude-sonnet-5, retired: true }
  - { id: builder-sol, collegium: engineering, kind: agent, model: gpt-5.6-sol, harness: codex, retired: true }
  - { id: qa-lead, collegium: qa, kind: agent, model: claude-opus-5-5 }
  - { id: sec-lead, collegium: qa, kind: agent, model: gpt-5.6-sol, harness: codex }
  # W-162 (D-046): the live seat `spec_reviewer` names; exactly this model, never the design magister.
  - { id: spec-reviewer, collegium: qa, kind: agent, model: gpt-5.6-sol, harness: codex }
  # D-033: declared so the closed codex lane's records (W-102–W-109) stay
  # readable and blocking-clean; not a live dispatch target.
  - { id: pre-reviewer, collegium: qa, kind: agent, model: gpt-5.6-terra, harness: codex }
  - { id: ops-lead, collegium: ops, kind: agent, model: claude-opus-5-5 }
  - { id: guest, collegium: production, kind: human }
probationes:
  - { id: tests, name: Tests, kind: automated, command: "npm test -s" }
  - { id: lint, name: Lint, kind: automated, command: "npm run -s lint" }
  - { id: types, name: Typecheck, kind: automated, command: "npm run -s typecheck" }
  - { id: spec, name: Spec, kind: agent, since: 2026-09-18T19:00:00Z }
  - { id: review, name: Lead review, kind: agent }
wip_limit: 4
# W-162 (D-046): `next` names no branch until this seat's review has passed after the architect's newest signature.
spec_reviewer: spec-reviewer
# W-127 (briefs/W-127.md): brief admission — one decree family per brief, at most
# this many numbered behaviours, one genuine red each; `ready` and `check` enforce it.
brief_behaviour_limit: 6
# W-209: the dossier's HTML pages are checkpoint records; a new page joins this list in a records PR.
source_excludes:
  - examples/
  - docs/design/dossier/bisellium-architecture.html
  - docs/design/dossier/bisellium-direction.html
  - docs/design/dossier/bisellium-dossier.html
  - docs/design/dossier/bisellium-status.html
  - docs/design/dossier/body.html
  - docs/design/dossier/head.html
  - docs/design/dossier/progress-body.html
  - docs/design/dossier/status-body.html
# W-137 (D-039): a done opus owes a retro once it ended at or after `since` (the ruling's own time); a high-severity
# fix is filed already greenlit by `high_greenlit_by`. Older done opera owe none.
retro: { since: 2026-10-06T06:06:57Z, high_greenlit_by: D-039 }
# D-015: how an opus branch reaches the trunk is a setting, not a fixed
# flow. This is the Patron's own reference flow — rebase the opus branch
# onto the trunk (bisellium merge does the rebase, then fast-forwards),
# push the trunk to origin and pull it back, and let a PR (still W-028's
# territory to open) carry the change for qa-lead's review.
integration:
  strategy: rebase
  push: true
  pull_after_push: true
  pr:
    required: true
    reviewer: qa-lead
standing_rules:
  - "Test-first with a recorded red."
  - "Mechanical work is a script you write, run and keep."
  - "Evidence is produced, never backfilled."
  - "Before structural screen changes, verify against the dossier's touchpoint mapping."
tiers:
  - { id: fast, model: gpt-5.6-luna }
  - { id: mid, model: gpt-5.6-terra }
  - { id: high, model: gpt-5.6-sol }
  - { id: escalation, model: gpt-6-astra }
  - { id: build, model: claude-sonnet-5 }
  - { id: review, model: claude-opus-5-5 }
munera:
  - { id: aggregation, tier: fast }
  - { id: audit, tier: mid }
  - { id: prereview, tier: mid }
  - { id: research, tier: high }
  - { id: redteam, tier: high }
  - { id: escalation, tier: escalation }
  - { id: build, tier: build }
  - { id: spec, tier: review }
  - { id: review, tier: review }
