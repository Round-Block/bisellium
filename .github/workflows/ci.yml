name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Required status check. Runs everything `bisellium ci` runs except the
  # studio officina check (see the `officina` job below) — this is the job a
  # branch protection rule can require, since every step here is expected to
  # pass on a clean tree.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 25
      - run: npm ci
      - run: npm run -s typecheck
      - run: npm run -s lint
      - run: npm run -s format:check
      - run: npm test
      - run: npm run -s check -- examples/sample-studio --repo .

  # Deliberately NOT required (W-028's ruling): `check -- studio` fails on
  # known officina debt, so this job stays honestly red until that debt
  # clears rather than being marked continue-on-error or dropped.
  officina:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 25
      - run: npm ci
      - run: npm run -s check -- studio --repo .
