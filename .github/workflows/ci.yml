name: CI

# W-131: `push` runs on master only, so a branch commit runs once (as a pull
# request) instead of twice. The post-merge master push always runs the full
# suite, which is what catches a record-only change that breaks a real-studio
# test.
#
# W-168: `merge_group` runs on the merge queue's temporary commit (the PR merged
# with the latest master). For an `opus/W-*` head, `certify` runs the existing
# mint on that merge result. W-243: any other head mints nothing and passes only
# when its merge group's diff against the base changes officina records alone
# (`recordOnly` in scripts/ci-scope.mjs); a source path, an empty diff or an
# unreadable one fails the check.
# W-203: there `gates` and `web-e2e` classify the group commit against the
# group's base, so a records-only group takes the records-only path; any source
# path takes the full path.
#
# W-205: the merge group is the one run of the heavy steps before merge: the full
# path for a source change, W-203's short path for a records-only one. A pull
# request still reports all four required checks: `gates` runs only setup,
# the npm audit (W-236), typecheck and lint; every step of `officina` and `web-e2e` is skipped, so those
# jobs succeed without work; `certify` is skipped. The post-merge master push
# runs the full path for either change kind. Sound only while master's ruleset
# requires the merge queue.
on:
  push:
    branches: [master]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      refresh_screenshots:
        description: Generate screenshot baselines on the CI runner and upload them for review
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Required status check. On a push and a source-change merge group it runs
  # everything `bisellium ci` runs except the studio officina check (see the
  # `officina` job below); a records-only merge group runs the studio check and
  # `test:record` instead (W-203), and a pull request runs only setup,
  # the npm audit (W-236), typecheck and lint (W-205). It is the job a branch protection rule can
  # require, since every step that runs here is expected to pass on a clean tree.
  # W-350: workflow_dispatch can select any ref in GitHub's UI. This job-level
  # condition admits a dispatch only on master, before checkout, dependency
  # installation or any cache-affecting step. Each checkout pins github.sha,
  # then attaches that exact commit to a constant local branch so Git-backed
  # checks can read a symbolic current branch without trusting an input ref.
  gates:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Attach the exact event commit to a CI branch
        run: git switch --force-create ci-event "$GITHUB_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: 25
      - run: npm ci
      - id: scope
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node scripts/ci-scope.mjs "$BASE_SHA" HEAD >> "$GITHUB_OUTPUT"
      # W-236: a moderate-or-worse npm advisory, or an unreachable registry, fails
      # the job (the same first step `bisellium ci` runs).
      - if: steps.scope.outputs.record_only != 'true'
        run: npm run -s audit
      - if: steps.scope.outputs.record_only != 'true'
        run: npm run -s typecheck
      - if: steps.scope.outputs.record_only != 'true'
        run: npm run -s lint
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm run -s format:check
      # W-131: the live run.test.ts rows need bubblewrap and unprivileged user
      # namespaces; the Ubuntu runner has neither out of the box, and the guard row
      # fails if one still skips under BISELLIUM_REQUIRE_LIVE_ROWS=1.
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm test
        env:
          BISELLIUM_REQUIRE_LIVE_ROWS: "1"
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/record-reads.mjs
          BISELLIUM_RECORD_READS: ${{ runner.temp }}/record-reads.log
      # W-139: the log above lists every test file that read the record-only
      # set; fail the run if test:record does not name exactly those.
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: node scripts/ci-scope.mjs --check-reads ${{ runner.temp }}/record-reads.log
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm run -s check -- examples/sample-studio --repo .
      # Records-only merge group: the studio officina check, then the tests that
      # read the record-only files (W-139; the full path's guard keeps the list exact).
      - if: steps.scope.outputs.record_only == 'true'
        run: npm run -s check -- studio --repo .
      - if: steps.scope.outputs.record_only == 'true'
        run: npm run -s test:record

  # Required status check (ruleset `master_protection`). W-028 once kept it out
  # of the required set while `check -- studio` failed on known officina debt;
  # that debt cleared (0 blocking findings) and it was required since. Never
  # marked continue-on-error. On a pull request every step skips (W-205), so the
  # job still concludes success; a merge group and a push run the studio check.
  # W-350 repeats the dispatch boundary at job scope so a non-master dispatch
  # reaches neither checkout nor npm ci.
  officina:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Attach the exact event commit to a CI branch
        if: github.event_name != 'pull_request'
        run: git switch --force-create ci-event "$GITHUB_SHA"
      - if: github.event_name != 'pull_request'
        uses: actions/setup-node@v5
        with:
          node-version: 25
      - if: github.event_name != 'pull_request'
        run: npm ci
      - if: github.event_name != 'pull_request'
        run: npm run -s check -- studio --repo .

  # Required status check (W-067): the served console's write path
  # (apps/server/src/http.ts's accepted-origin pair, the sessionStorage
  # token, the ok:false contract) has no coverage anywhere else — an
  # interaction guard that only runs on the builder's own machine is not a
  # guard. Builds apps/web/dist from scratch (a removed dist first, so a
  # stale bundle can't quietly satisfy it) and drives it with the
  # served-dist harness (apps/web/playwright.serve.config.ts). No
  # continue-on-error, and never merged into the separate
  # `officina` job above. On a pull request, and in a records-only merge group,
  # the build and E2E steps skip (W-205, W-203); a push and a source-change merge
  # group run them. W-350 applies the same dispatch boundary before this job's
  # checkout, install, browser cache and artifact steps.
  web-e2e:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Attach the exact event commit to a CI branch
        if: github.event_name != 'pull_request'
        run: git switch --force-create ci-event "$GITHUB_SHA"
      - if: github.event_name != 'pull_request'
        uses: actions/setup-node@v5
        with:
          node-version: 25
      - if: github.event_name != 'pull_request'
        run: npm ci
      - id: scope
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node scripts/ci-scope.mjs "$BASE_SHA" HEAD >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm run -s test:policy --workspace @bisellium/web
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: rm -rf apps/web/dist
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm run -s build --workspace @bisellium/web
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: npm run -s test:serve --workspace @bisellium/web
        env:
          BISELLIUM_UPDATE_SCREENSHOTS: ${{ inputs.refresh_screenshots && '1' || '0' }}
      - if: github.event_name != 'pull_request' && steps.scope.outputs.record_only != 'true'
        run: node --import tsx apps/web/tests-serve/rendering-environment.ts apps/web/tests-serve/screenshots.spec.ts-snapshots/rendering-environment.json
        env:
          BISELLIUM_UPDATE_SCREENSHOTS: ${{ inputs.refresh_screenshots && '1' || '0' }}
      - if: github.event_name == 'workflow_dispatch' && inputs.refresh_screenshots
        uses: actions/upload-artifact@v6
        with:
          name: web-screenshot-baselines-${{ github.sha }}
          if-no-files-found: error
          path: apps/web/tests-serve/screenshots.spec.ts-snapshots/

  # W-168: the merge queue's certification. Runs only on a merge group. The
  # certifying code is master's (`tooling`, checked out at the merge group's
  # base commit), never the merge-group commit's own copy: scripts/ci-certify.mjs
  # rebases an `opus/W-*` PR head onto the base inside the job and runs the
  # existing mint on it; any other head is judged by its diff (W-243, above). A
  # non-zero exit fails the required `certify` check, so GitHub drops the PR from
  # the queue. Skipped on a pull request, which a required check
  # counts as passing.
  certify:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          path: tooling
          ref: ${{ github.event.merge_group.base_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 25
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: tooling
      - run: npm ci
        working-directory: candidate
      - run: npx playwright install --with-deps chromium
        working-directory: candidate
      - run: node --import tsx scripts/ci-certify.mjs --candidate ../candidate --studio studio 2>&1 | tee "${{ runner.temp }}/certify.log"
        shell: bash
        working-directory: tooling
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: certify-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            candidate/studio/receipts/
            ${{ runner.temp }}/certify.log

  # W-396: certify's certificate (W-370), posted as the one `certify-certificate`
  # check run on the merge-group commit, which the queue makes the merge commit,
  # so the done perform reads it through api.github.com. Runs only after certify
  # succeeded on a merge group. Its token reads contents (the checkout needs it)
  # and writes check runs, nothing more; no other job may write a check run. The
  # publisher is master's (`tooling`, the merge group's base commit), never the
  # candidate's: the first step refuses a base_sha that is not a 40-hex commit id
  # before any checkout (an empty ref would check out the candidate), and the step
  # after the checkout refuses a tooling HEAD that is not base_sha. An artifact
  # with no receipt (a records-only head mints none) publishes nothing. Not a
  # required check: a failure leaves the merge alone and fails the run.
  certificate:
    needs: certify
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Refuse a merge-group base that is not a commit id
        shell: bash
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "certificate: refused: base_sha is not a 40-hex commit id"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: tooling
          ref: ${{ github.event.merge_group.base_sha }}
          persist-credentials: false
      - name: Refuse a tooling checkout that is not the merge-group base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          head="$(git -C tooling rev-parse HEAD)" || { echo "certificate: refused: tooling has no HEAD"; exit 1; }
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$head" != "$BASE_SHA" ]]; then
            echo "certificate: refused: tooling HEAD $head is not base_sha"
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          name: certify-${{ github.run_id }}
          path: certify
      - uses: actions/setup-node@v5
        with:
          node-version: 25
      - if: hashFiles('certify/**/receipts/**/*.json') != ''
        run: node tooling/scripts/ci-certificate.mjs --dir certify
        env:
          GH_TOKEN: ${{ github.token }}
