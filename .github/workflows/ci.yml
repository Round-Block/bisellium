name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm ci
      - run: npm run -s typecheck
      - run: npm run -s lint
      - run: npm run -s format:check
      - run: npm test
      - run: npm run -s check -- studio --repo .
      - run: npm run -s check -- examples/sample-studio --repo .
